backend:
  name: git-gateway
  branch: main

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "yazilar"
    label: "Yazılar"
    label_singular: "Yazı"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    fields:
      - { label: "Başlık", name: "title", widget: "string", hint: "Yazının adı" }
      - { label: "Tarih", name: "tarih", widget: "string", hint: "Örnek: 28 Temmuz 2026" }
      - { label: "Kısa özet", name: "ozet", widget: "text", required: false, hint: "Ana sayfada görünecek 1-2 cümlelik özet (isteğe bağlı)" }
      - { label: "Yazı", name: "body", widget: "markdown" }
    view_filters:
      - label: "Tümü"
        field: title
    view_groups:
      - label: "Tarihe göre"
        field: tarih
