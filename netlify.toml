[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Fotoğraf dosya adları içeriğinden türediği için bir fotoğraf asla değişmez;
# tarayıcılar bir yıl boyunca saklayabilir.
[[headers]]
  for = "/images/yazi/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
